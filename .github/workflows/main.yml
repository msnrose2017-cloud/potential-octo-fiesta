name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389
          net start TermService || exit 0

      - name: Create RDP User
        shell: cmd
        run: |
          net user RDP "P@ssw0rd2026!#" /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add

      - name: Install and Connect Tailscale
        shell: cmd
        run: |
          curl -s -L -o C:\tailscale.msi https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi
          msiexec /i C:\tailscale.msi /quiet /norestart
          timeout /t 10 /nobreak
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-%GITHUB_RUN_ID% --unattended

      - name: Show Connection Info
        shell: pwsh
        run: |
          Start-Sleep -Seconds 8
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "`n=============================="
          Write-Host "Tailscale IP : $ip"
          Write-Host "Username     : RDP"
          Write-Host "Password     : P@ssw0rd2026!#"
          Write-Host "==============================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] Session is active..."
              Start-Sleep -Seconds 180
          }
