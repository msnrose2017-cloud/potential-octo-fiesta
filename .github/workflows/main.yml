name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389
          net start TermService

      - name: Create RDP User
        shell: cmd
        run: |
          net user RDP "P@ssw0rd2026!#" /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ip = tailscale ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=============================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : RDP"
          Write-Host "Password     : P@ssw0rd2026!#"
          Write-Host "==============================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] Session is active..."
              Start-Sleep -Seconds 180
          }
